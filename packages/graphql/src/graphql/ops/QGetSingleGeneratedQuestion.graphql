query GetSingleGeneratedQuestion($id: Int!) {
  generatedQuestion(id: $id) {
    __typename

    ... on ChoicesElement {
      id
      name
      type
      content
      explanation

      options {
        __typename
        hasSampleSolution
        hasAnswerFeedbacks
        displayMode
        choices {
          ix
          correct
          feedback
          value
        }
      }
    }

    ... on NumericalElement {
      id
      name
      type
      content
      explanation

      options {
        hasSampleSolution
        accuracy
        placeholder
        unit
        restrictions {
          min
          max
        }
        solutionRanges {
          min
          max
        }
      }
    }

    ... on FreeTextElement {
      id
      name
      type
      content
      explanation

      options {
        hasSampleSolution
        restrictions {
          maxLength
        }
        solutions
      }
    }

    ... on FlashcardElement {
      id
      name
      type
      content
      explanation
    }

    ... on ContentElement {
      id
      name
      type
      content
      explanation
    }
  }
}
