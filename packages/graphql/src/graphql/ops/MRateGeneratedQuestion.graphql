mutation RateQuestion($id: Int!, $factualCorrectness: Int!, $difficultyRate: Int!, $typeRate: Int!, $relevance: Int!, $ambiguity: Int!) {
    rateQuestion(id: $id, factualCorrectness: $factualCorrectness, difficultyRate: $difficultyRate, typeRate: $typeRate, relevance: $relevance,  ambiguity: $ambiguity) {
      id
      factualCorrectness
      difficultyRate
      typeRate
      relevance
      ambiguity
    }
}