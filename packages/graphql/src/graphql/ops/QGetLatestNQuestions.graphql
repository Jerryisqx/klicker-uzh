query GetLatestNQuestions($limit: Int!) {
  latestNQuestions(limit: $limit) {
    __typename

    ... on ChoicesElement {
      id
      name
      type
      content

      createdAt
      updatedAt

      options {
        __typename
        hasSampleSolution
        hasAnswerFeedbacks
        displayMode
        choices {
          ix
          correct
          feedback
          value
        }
      }
    }

    ... on NumericalElement {
      id
      name
      type
      content

      createdAt
      updatedAt


      options {
        __typename
        hasSampleSolution
        hasAnswerFeedbacks
        placeholder
        accuracy
        unit
        solutionRanges {
          __typename
          min
          max
        }
        restrictions {
          __typename
          min
          max
        }
      }
    }

    ... on FreeTextElement {
      id
      name
      type
      content

      createdAt
      updatedAt

      options {
        __typename
        hasSampleSolution
        hasAnswerFeedbacks
        solutions
        restrictions {
          __typename
          maxLength
        }
      }
    }

    ... on FlashcardElement {
      id
      name
      type
      content

      createdAt
      updatedAt
    }

    ... on ContentElement {
      id
      name
      type
      content

      createdAt
      updatedAt
    }
  }
}
